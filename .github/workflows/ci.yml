name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: ghcr.io
  SHA: ${{ github.sha }}
  ECHO_API_IMAGE: ghcr.io/${{ github.repository_owner }}/echo-api
  ECHO_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/echo-worker

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  build:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [api, worker]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/echo-${{ matrix.app }}:${{ env.SHA }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/echo-${{ matrix.app }}:latest
          cache-from: type=gha,scope=echo-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=echo-${{ matrix.app }}

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Join tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_CLIENT_SECRET }}
          tags: tag:ci

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply manifests
        run: kubectl apply -f k8s/api-deployment.yaml -f k8s/api-service.yaml -f k8s/worker-deployment.yaml -f k8s/worker-service.yaml

      - name: Run database migrations
        run: |
          export ECHO_API_IMAGE="${ECHO_API_IMAGE}:${SHA}"
          kubectl -n echo delete job echo-db-migrate --ignore-not-found
          envsubst < k8s/migration-job.yaml | kubectl apply -f -
          kubectl -n echo wait --for=condition=complete job/echo-db-migrate --timeout=300s

      - name: Roll out new images
        run: |
          kubectl -n echo set image deployment/echo-api api="${ECHO_API_IMAGE}:${SHA}"
          kubectl -n echo set image deployment/echo-worker worker="${ECHO_WORKER_IMAGE}:${SHA}"
          kubectl -n echo rollout status deployment/echo-api --timeout=300s
          kubectl -n echo rollout status deployment/echo-worker --timeout=300s
