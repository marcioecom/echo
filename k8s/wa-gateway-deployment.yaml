apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-wa-gateway
  namespace: echo
  labels:
    app.kubernetes.io/name: echo-wa-gateway
    app.kubernetes.io/part-of: echo
spec:
  # F2 keeps a single socket. F3 (session leases) is what lets this rise above 1.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-wa-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-wa-gateway
        app.kubernetes.io/part-of: echo
    spec:
      terminationGracePeriodSeconds: 45
      # Keep the gateway next to Postgres/Valkey (fsn1) so writes stay in-region.
      # Keep in sync with orbit:dataNodeSelector.
      nodeSelector:
        topology.kubernetes.io/region: fsn1
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: wa-gateway
          image: ${ECHO_WA_GATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3003
          envFrom:
            - secretRef:
                name: echo-shared-secrets
            - secretRef:
                name: echo-worker-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: WA_GATEWAY_PORT
              value: "3003"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: echo-wa-gateway
  namespace: echo
  labels:
    app.kubernetes.io/name: echo-wa-gateway
    app.kubernetes.io/part-of: echo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-wa-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: echo-wa-gateway
  namespace: echo
  labels:
    app.kubernetes.io/name: echo-wa-gateway
    app.kubernetes.io/part-of: echo
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: echo-wa-gateway
  policyTypes:
    - Ingress
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 5222
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
