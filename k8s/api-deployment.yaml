apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo-api
  namespace: echo
  labels:
    app.kubernetes.io/name: echo-api
    app.kubernetes.io/part-of: echo
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: echo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-api
        app.kubernetes.io/part-of: echo
    spec:
      # Keep the API next to Postgres/Valkey (fsn1) so queries stay in-region.
      # Keep in sync with orbit:dataNodeSelector.
      nodeSelector:
        topology.kubernetes.io/region: fsn1
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: api
          image: ${ECHO_API_IMAGE}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - secretRef:
                name: echo-shared-secrets
            - secretRef:
                name: echo-api-secrets
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false
