apiVersion: batch/v1
kind: Job
metadata:
  name: echo-db-migrate
  namespace: echo
  labels:
    app.kubernetes.io/name: echo-db-migrate
    app.kubernetes.io/part-of: echo
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: echo-db-migrate
        app.kubernetes.io/part-of: echo
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: migrate
          image: ${ECHO_API_IMAGE}
          imagePullPolicy: IfNotPresent
          workingDir: /app/node_modules/@workspace/db
          command: ["node", "dist/migrate.js"]
          envFrom:
            - secretRef:
                name: echo-shared-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      automountServiceAccountToken: false
